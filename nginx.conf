# nginx server block for Whiskerwatch (replaces the image's default.conf).
#
# Three jobs, in order of how easy they are to get wrong:
#
#   1. Cache headers. Whiskerwatch registers a service worker (public/sw.js).
#      If sw.js or index.html are cached by the browser or an intermediary, a GM
#      can be pinned to an old build for as long as that cache lives — and the
#      SW's stale-while-revalidate strategy will happily keep serving it offline.
#      So the shell and the SW revalidate on every request; only content-hashed
#      assets are cached long.
#   2. SPA fallback. The app switches screens via in-app state, so any deep path
#      must return index.html and let the client take over.
#   3. Security headers. The app talks to nothing but its own origin (all data
#      lives in localStorage/IndexedDB), so the CSP can be genuinely strict.
#
# A note on `add_header` inheritance: nginx drops ALL inherited add_header
# directives in a location that declares its own. Locations below therefore use
# `expires` (which does not reset inheritance) wherever possible, and the one
# location that must call add_header repeats the headers explicitly.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Compress on the fly — the Vite build emits plain files, so gzip_static
    # would silently do nothing, and Traefik in front of this does not compress.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/manifest+json
        image/svg+xml;

    # ── Security headers ─────────────────────────────────────────────────────
    # Inherited by every location that does not declare its own add_header.
    #
    # The CSP is deliberately tight: Whiskerwatch loads no third-party scripts,
    # fonts (@fontsource is bundled) or images, and makes no network requests at
    # all. 'unsafe-inline' is needed for style-src only because several
    # components set style="..." attributes, which CSP counts as inline styles.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    # No camera/mic/geolocation/etc. is used anywhere in the app.
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;

    # ── Must always revalidate ───────────────────────────────────────────────
    # `expires -1` emits Cache-Control: no-cache (revalidate before reuse) and
    # keeps the security headers above, unlike an add_header of its own.

    # The service worker itself. A cached sw.js is the classic way to strand
    # users on an old build.
    location = /sw.js {
        expires -1;
    }

    # The app shell. Its <script src> points at a hashed bundle, so this file is
    # the only thing standing between a deploy and users seeing it.
    location = /index.html {
        expires -1;
    }

    # nginx's bundled mime.types has no .webmanifest entry, so without an
    # explicit type the manifest goes out as application/octet-stream and Chrome
    # ignores it (no install prompt). This is deliberately done with
    # `default_type` in one location rather than a server-level `types` block:
    # a `types` block REPLACES the inherited MIME table wholesale, which would
    # silently reduce index.html and every bundle to octet-stream too.
    location = /manifest.webmanifest {
        expires -1;
        default_type application/manifest+json;
    }

    # Build stamp written by the Dockerfile — useful for confirming what is live.
    location = /version.txt {
        expires -1;
        default_type text/plain;
    }

    # Real file in public/, so it is served rather than falling through to the
    # SPA fallback and handing crawlers HTML. Short cache: it changes rarely, but
    # a year-long cache on a policy file is a mistake that takes a year to undo.
    location = /robots.txt {
        expires 1h;
    }

    # ── Content-hashed assets ────────────────────────────────────────────────
    # Vite fingerprints everything under /assets/ — bundles, CSS and the bundled
    # @fontsource files alike — so these are safe to cache forever.
    #
    # `^~` is load-bearing: nginx evaluates regex locations before plain prefix
    # locations, so without it the .woff2/.svg regex below would win for hashed
    # fonts and downgrade them from immutable to a 7-day cache.
    #
    # `immutable` needs add_header, which resets header inheritance — hence
    # nosniff and the CSP are repeated here. Both matter for subresources:
    # nosniff stops a bundle being reinterpreted as another type, and the CSP
    # applies to workers spawned from this path.
    location ^~ /assets/ {
        # No `expires` here: it would emit a second, competing Cache-Control
        # header alongside the add_header below. The add_header alone says
        # everything, so `expires` is redundant.
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        # Never fall through to the SPA route: a missing asset must be a 404,
        # not an HTML page served with a .js content type.
        try_files $uri =404;
    }

    # Unhashed static files from public/ (icon.svg and friends). Cached, but not
    # immutable — they keep the same name across builds.
    location ~* \.(svg|png|jpg|jpeg|gif|webp|avif|ico|woff2?|ttf|eot)$ {
        expires 7d;
        try_files $uri =404;
    }

    # ── SPA fallback ─────────────────────────────────────────────────────────
    # Any unknown path returns the shell so the in-app navigation can resolve
    # it. Uses @fallback rather than /index.html directly so the shell picks up
    # the no-cache treatment above.
    location / {
        try_files $uri $uri/ @fallback;
    }

    location @fallback {
        expires -1;
        try_files /index.html =404;
    }
}
