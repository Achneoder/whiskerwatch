name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch makes an in-flight run irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck & unit tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test:run

      - name: Production build
        run: pnpm build

  e2e:
    name: End-to-end (Cucumber + Playwright)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # features/support/world.ts launches Playwright's own Chromium unless
      # WW_CHROMIUM_PATH (or /opt/pw-browsers/chromium) exists, so install it.
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      # test:e2e builds first and serves dist/ with `vite preview`.
      - name: Run feature suite
        run: pnpm test:e2e
