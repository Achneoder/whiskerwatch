name: Release & Docker Image

# Publishes ghcr.io/achneoder/whiskerwatch, versioned by semantic-release.
#
# Every image carries a semantic version. On a push to main, semantic-release
# reads the Conventional Commit messages since the last release and works out
# the next version. A release-worthy push (feat, fix, perf, or a breaking
# change) then:
#
#   1. builds the image and tests it while running,
#   2. tags the commit vX.Y.Z and publishes a GitHub Release with notes,
#   3. pushes the image as X.Y.Z, X.Y, X, latest and sha-<short>.
#
# A push with nothing to release (docs, chore, test, ...) builds nothing. The
# version is tagged only after the image has passed its tests, so a release
# never exists without a working image, and the image is pushed only once the
# tag exists, so an image never names a version that was not released.
#
# Re-running a failed run is safe: a commit that already carries a vX.Y.Z tag
# reuses that version instead of computing a new one. Running the workflow by
# hand on a tag (e.g. v1.2.3) rebuilds and re-pushes that exact version; only a
# build of main moves the floating X.Y, X and latest tags.
#
# Deployments always pin an explicit version (never `latest`) — see
# docs/DEPLOYMENT.md.
#
# The unit and feature suites in ci.yml exercise the app under `vite preview`,
# which knows nothing about the SPA fallback, MIME types or the
# Content-Security-Policy that this image adds. That is why the image itself is
# tested here before anything is published.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/achneoder/whiskerwatch
  # Local-only tag used between build and push.
  LOCAL_TAG: whiskerwatch:candidate

jobs:
  version:
    name: Determine version
    runs-on: ubuntu-latest
    permissions:
      # semantic-release checks it could push the tag, even in a dry run.
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      already-released: ${{ steps.version.outputs.already-released }}

    steps:
      - uses: actions/checkout@v7
        with:
          # semantic-release needs the full history and every tag.
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The dry run writes the next version to .release-version via the
      # verifyReleaseCmd in .releaserc.json; no file means nothing to release.
      - name: Compute version
        id: version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if tag=$(git describe --tags --exact-match --match 'v[0-9]*' HEAD 2>/dev/null); then
            echo "HEAD is already released as $tag."
            echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
            echo "already-released=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          pnpm exec semantic-release --dry-run
          if [ -s .release-version ]; then
            version=$(cat .release-version)
            echo "Next version: $version"
            echo "version=$version" >> "$GITHUB_OUTPUT"
          else
            echo "No release-worthy commits since the last release; nothing to build."
          fi
          echo "already-released=false" >> "$GITHUB_OUTPUT"

  build:
    name: Build, verify, release and push
    needs: version
    if: needs.version.outputs.version != ''
    runs-on: ubuntu-latest
    permissions:
      # contents: tag + GitHub Release. issues / pull-requests: semantic-release
      # comments on and labels what each release shipped.
      contents: write
      issues: write
      pull-requests: write
      packages: write

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Compute image tags
        id: tags
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          SHORT_SHA=$(git rev-parse --short HEAD)
          TAGS="$VERSION sha-$SHORT_SHA"

          # Floating tags follow main only, so rebuilding an old release by
          # hand never drags `latest` or `1` back to it.
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then
            MAJOR=${VERSION%%.*}
            MINOR=${VERSION#*.}; MINOR=${MINOR%%.*}
            TAGS="$TAGS $MAJOR.$MINOR $MAJOR latest"
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tags=$TAGS"       >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION"
          echo "Tags: $TAGS"

      - uses: docker/setup-buildx-action@v4

      # Single-platform (linux/amd64) on purpose: --load only supports one
      # platform, and testing the exact artefact that gets pushed is worth more
      # than an arm64 variant nothing currently deploys.
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: ${{ env.LOCAL_TAG }}
          build-args: |
            APP_VERSION=${{ steps.tags.outputs.version }}
          cache-from: type=gha,scope=whiskerwatch
          cache-to: type=gha,scope=whiskerwatch,mode=max

      - name: Start the container
        run: |
          docker run -d --name candidate -p 8080:80 "$LOCAL_TAG"
          for _ in $(seq 1 30); do
            if [ "$(docker inspect -f '{{.State.Health.Status}}' candidate)" = "healthy" ]; then
              echo "Container healthy."
              exit 0
            fi
            sleep 2
          done
          echo "::error::Container never became healthy"
          docker logs candidate
          exit 1

      # Asserts the things only this image can get wrong. Each check names the
      # failure it guards against, because a wrong cache header does not break
      # anything until users are stuck on a stale build.
      - name: Verify the served response
        run: |
          set -euo pipefail
          base=http://localhost:8080
          fail() { echo "::error::$1"; exit 1; }

          # App shell must be reachable and must not be cached.
          curl -fsS "$base/" -o /dev/null || fail "app shell not served"
          curl -fsSI "$base/" | grep -qi 'cache-control:.*no-cache' \
            || fail "index.html is cacheable — a deploy would not reach users holding a cached shell"

          # The service worker must revalidate, or an old SW keeps serving an
          # old app offline forever.
          curl -fsSI "$base/sw.js" | grep -qi 'cache-control:.*no-cache' \
            || fail "sw.js is cacheable — clients could be pinned to a stale service worker"

          # Manifest needs the right content type or the PWA install prompt is
          # silently dropped.
          curl -fsSI "$base/manifest.webmanifest" | grep -qi 'content-type: *application/manifest+json' \
            || fail "manifest.webmanifest served with the wrong content type"

          # Deep links are client-side routes: they must return the shell, not 404.
          test "$(curl -s -o /dev/null -w '%{http_code}' "$base/roster")" = "200" \
            || fail "SPA fallback missing — deep links would 404"

          # A missing asset must 404 rather than fall through to index.html,
          # which would hand the browser HTML with a JS content type.
          test "$(curl -s -o /dev/null -w '%{http_code}' "$base/assets/does-not-exist.js")" = "404" \
            || fail "missing assets fall through to the SPA fallback"

          # Hashed assets are cached for a year; verify one real bundle.
          asset=$(curl -fsS "$base/" | grep -o '/assets/[A-Za-z0-9._-]*\.js' | head -1)
          test -n "$asset" || fail "could not find a hashed bundle in index.html"
          curl -fsSI "$base$asset" | grep -qi 'cache-control:.*immutable' \
            || fail "hashed assets are not cached immutably"

          curl -fsSI "$base/" | grep -qi 'content-security-policy' \
            || fail "Content-Security-Policy header missing"

          echo "Version stamp: $(curl -fsS "$base/version.txt")"

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      # The real GM workflows, run against the actual image. This is what catches
      # a Content-Security-Policy that is one directive too strict — the app
      # would load but quietly fail to render or store anything.
      - name: Run feature suite against the container
        env:
          # WW_BASE_URL points the suite at the container, so features/support
          # skips spawning its own `vite preview` server.
          WW_BASE_URL: http://localhost:8080
          # The step definitions are TypeScript; test:e2e supplies this loader
          # via its own script, so it has to be repeated here.
          NODE_OPTIONS: --import tsx/esm
        run: pnpm exec cucumber-js

      - name: Container logs on failure
        if: failure()
        run: docker logs candidate

      - name: Stop the container
        if: always()
        run: docker rm -f candidate || true

      # Only now — with a tested image in hand — does the version become real.
      - name: Publish the release
        if: needs.version.outputs.already-released != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm exec semantic-release

      # semantic-release exits successfully without releasing when main moved
      # on during this run (a newer push is then queued behind this one). Never
      # push an image for a version that has no tag.
      - name: Confirm the release tag exists
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null \
            || { echo "::error::v$VERSION was not released; not pushing an image for it."; exit 1; }

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        run: |
          set -euo pipefail
          for tag in ${{ steps.tags.outputs.tags }}; do
            docker tag "$LOCAL_TAG" "$IMAGE:$tag"
            docker push "$IMAGE:$tag"
            echo "Pushed $IMAGE:$tag"
          done

      - name: Summary
        run: |
          {
            echo "## Image published"
            echo
            echo "- **Repository:** \`$IMAGE\`"
            echo "- **Version:** \`${{ steps.tags.outputs.version }}\`"
            echo "- **Tags:** ${{ steps.tags.outputs.tags }}"
          } >> "$GITHUB_STEP_SUMMARY"
